name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, urllib.request

          target = pathlib.Path("index.html")
          if target.exists() and len(target.read_bytes()) > 50000:
              print("index.html already present, skip fetching")
          else:
              source = "https://workbuddy-space-static.codebuddy.work/page/bvjshEOD2LgJkbn9GQSs3j/uH1PP08NRZPM/interest-sorter.html"
              request = urllib.request.Request(source, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  html = response.read().decode("utf-8")
              if "<!DOCTYPE html>" not in html or len(html) < 50000:
                  raise SystemExit("unexpected page artifact, aborting")
              # Remove the WorkBuddy host injection script and editor anchor attributes
              html = re.sub(r'<script[^>]*src="/page/page_comm/inject\.js"[^>]*></script>\s*', "", html)
              html = re.sub(r'\sdata-(?:page-node-id|pnid-children)="[^"]*"', "", html)
              target.write_text(html, encoding="utf-8", newline="\n")
              print("built index.html bytes:", len(html.encode("utf-8")))
          PY
          mkdir -p dist
          cp index.html dist/index.html

      - name: Commit generated page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged, skip commit"
          else
            git commit -m "Build standalone index.html [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
